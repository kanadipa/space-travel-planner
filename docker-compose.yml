services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smp
      POSTGRES_PASSWORD: smp
      POSTGRES_DB: smp
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
